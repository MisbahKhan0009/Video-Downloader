name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Builds on main always run to the end (a newer push waits instead of killing it),
# so every push gets its installers. Only pull request builds are cancelled early.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles nsis msi
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/
          cp src-tauri/target/release/bundle/msi/*.msi dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: vidra-windows
          path: dist/*

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK and NDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android/app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            ALIAS="$KEY_ALIAS"; SP="$KEYSTORE_PASSWORD"; KP="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Signing with a throwaway key; installs work, but each build needs an uninstall before updating."
            ALIAS=vidra; SP=vidra-temp-pass; KP=vidra-temp-pass
            keytool -genkeypair -v -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$KP" -dname "CN=Vidra, O=Vidra, C=BD"
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$SP"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KP"
          } > keystore.properties
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 armv7 x86_64
      - name: Collect
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -print
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal-release*.apk' | head -1)" "dist/Vidra_${VERSION}_android.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: vidra-android
          path: dist/*.apk

  release:
    name: GitHub Release
    # Every push to main (and any v* tag or manual run) publishes the installers.
    if: github.event_name != 'pull_request'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Point the version tag at this build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.v.outputs.tag }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.v.outputs.tag }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Vidra ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          overwrite_files: true
          make_latest: true
          body: |
            **Windows:** download the `-setup.exe` (or the `.msi`) and run it.
            **Android:** download the `.apk`, open it, and allow installs from this source.

            Built from ${{ github.sha }} on ${{ github.ref_name }}. Every push to `main` refreshes these files; bump `version` in `src-tauri/tauri.conf.json` to start a new release.
